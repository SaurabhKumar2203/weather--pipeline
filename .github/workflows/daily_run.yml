name: Daily Weather Pipeline

# Trigger: Run every day at 6:00 AM UTC (which is ~11:30 AM IST)
on:
  schedule:
    - cron: '0 6 * * *'
  # Allow running manually from the Actions tab for testing
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. Install Libraries
      - name: Install Dependencies
        run: |
          pip install requests pandas pandas-gbq google-auth google-cloud-bigquery db-dtypes

      # 4. Create the Service Account Key from Secret
      # This takes the text you saved in GitHub Secrets and turns it back into a file
      - name: Create Service Account JSON
        run: |
          echo '${{ secrets.GCP_KEYS }}' > service_account.json

      # 5. Run the Script
      - name: Run ETL Pipeline
        env:
          API_KEY: ${{ secrets.API_KEY }}  # Inject the API Key
        run: python extract_weather.py